openapi: 3.0.0
info:
  title: VegVision
  version: 1.0.0

paths:
  /:
    x-yc-apigateway-any-method:
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: your-container-id
        service_account_id: your-service-account-id

  /{proxy+}:
    x-yc-apigateway-any-method:
      parameters:
        - name: proxy
          in: path
          required: false
          schema:
            type: string
          style: simple
          explode: false
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: your-container-id
        service_account_id: your-service-account-id
